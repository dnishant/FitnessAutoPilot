name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate SQL migrations exist
        run: |
          test -f supabase/migrations/20260307000100_init_schema.sql
          test -f supabase/migrations/20260907000100_rmr_estimates.sql
          test -f supabase/migrations/20260907000200_tdee_estimates.sql
          test -f supabase/seed.sql
          grep -n "enable row level security" supabase/migrations/20260307000100_init_schema.sql
          grep -n "auth.uid() = user_id" supabase/migrations/20260307000100_init_schema.sql
          grep -n "enable row level security" supabase/migrations/20260907000100_rmr_estimates.sql
          grep -n "auth.uid() = user_id" supabase/migrations/20260907000100_rmr_estimates.sql
          grep -n "enable row level security" supabase/migrations/20260907000200_tdee_estimates.sql
          grep -n "auth.uid() = user_id" supabase/migrations/20260907000200_tdee_estimates.sql

      - name: RLS test file present
        run: |
          test -f supabase/tests/rls/cross_user_isolation.sql
          grep -n "rmr_estimates" supabase/tests/rls/cross_user_isolation.sql
          grep -n "tdee_estimates" supabase/tests/rls/cross_user_isolation.sql
